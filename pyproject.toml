[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jiho_book"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sphinx>=9.1",
]

[project.scripts]
startproject = "scripts.startproject:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["scripts*"]

[dependency-groups]
dev = [
    "sphinx-lint>=1.0.2",
]
